[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["instrument/**/*.py", "tests/test_instrument*.py", "scripts/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["instrument", "scripts/setup_instrument_models.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
