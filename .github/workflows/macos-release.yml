name: Mac launcher release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (major.minor.patch)'
        required: true
      publish:
        description: 'Publish the verified installer (otherwise keep a draft)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    environment: macos-release
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ inputs.version }}
      D2M_SIGN_IDENTITY: ${{ secrets.D2M_SIGN_IDENTITY }}
      D2M_NOTARY_PROFILE: Dance2Music
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.17'
          architecture: arm64
      - name: Validate version and select pinned Xcode
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain -buildVersion 17F109
          xcrun metal --version
      - name: Install pinned build tools
        run: |
          python packaging/macos/bootstrap.py
          echo "$GITHUB_WORKSPACE/.packaging/build-venv/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*assets.py'
          python -m unittest discover -s tests -p 'test_magenta_runtime.py'
          python -m unittest discover -s tests -p 'test_magenta_install.py'
          python -m unittest discover -s tests -p 'test_release_link.py'
          python -m unittest discover -s tests -p 'test_packaged_backend.py'
      - name: Import signing and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.D2M_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.D2M_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.D2M_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.D2M_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.D2M_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/dance2music.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer.p12"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials "$D2M_NOTARY_PROFILE" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$keychain"
      - name: Build signed application
        run: python packaging/macos/build.py --version "$VERSION" --output .packaging/release --jobs 3
      - name: Notarize app and disk image
        run: python packaging/macos/notarize.py --app .packaging/release/Dance2Music.app --version "$VERSION" --output .packaging/installers
      - name: Create release draft with verified assets
        run: |
          gh release create "mac-v$VERSION" --draft --target "$GITHUB_SHA" --title "Dance2Music $VERSION for Mac" --notes-file packaging/macos/release-notes.md
          gh release upload "mac-v$VERSION" ".packaging/installers/Dance2Music-$VERSION-arm64.dmg" .packaging/installers/SHA256SUMS .packaging/installers/release-manifest.json
      - name: Publish and refresh website download link
        if: inputs.publish
        run: |
          gh release edit "mac-v$VERSION" --draft=false
          gh workflow run pages.yml --ref main
      - name: Remove ephemeral credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/dance2music.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer.p12" "$RUNNER_TEMP/notary.p8"
